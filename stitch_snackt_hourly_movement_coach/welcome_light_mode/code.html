<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
        }
        
        .liquid-glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        .wave-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            opacity: 0.5;
        }

        .wave {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(34, 105, 95, 0.03) 45%, transparent 50%);
            border-radius: 40%;
            animation: rotate 25s linear infinite;
        }

        .wave-2 {
            animation-duration: 35s;
            opacity: 0.6;
            border-radius: 35%;
        }

        @keyframes rotate {
            from { transform: translate(-25%, -25%) rotate(0deg); }
            to { transform: translate(-25%, -25%) rotate(360deg); }
        }

        .cta-shadow {
            box-shadow: 0 20px 40px -10px rgba(34, 105, 95, 0.25);
        }
        
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<!-- Navigation Shell Suppression: This is an onboarding screen, so no TopAppBar or BottomNavBar is rendered -->
<script>
        // Micro-interaction: Subtle parallax on bento cards based on tilt (simulated via mouse/touch)
        const main = document.querySelector('main');
        main.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.liquid-glass');
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / 45;
            
            cards.forEach(card => {
                card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });
        });

        // Handle button click feedback
        const btn = document.querySelector('button');
        btn.addEventListener('click', () => {
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Preparing...`;
            setTimeout(() => {
                // Future transition logic
            }, 800);
        });
    </script>
