                    "inverse-on-surface": "#eff1ef",
                    "surface-container": "#eceeec",
                    "on-background": "#191c1b",
                    "on-primary-fixed": "#00201c",
                    "on-primary": "#ffffff",
                    "outline": "#6f7976",

                    "surface-variant": "#e1e3e1",
                    "tertiary-fixed-dim": "#ffb59e",

                    "secondary-fixed": "#ffdbd1",

<style>
        body {
            background-color: #f8faf8;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: contain;
        }
        
        .liquid-glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .detecting-pulse {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        .rep-counter-bump {
            animation: bump 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 m-0 overflow-hidden font-body-md text-on-background">
<!-- Screen Canvas -->
<main class="relative w-full max-w-[640px] h-screen bg-surface flex flex-col items-center justify-between py-16 px-container-padding">
<!-- Top App Bar - Simplified Shell -->
<header class="w-full flex justify-between items-center fixed top-0 px-container-padding py-unit z-10 backdrop-blur-xl">
<button class="p-2 -ml-2 text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary-container detecting-pulse"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant/70 tracking-wide uppercase">Detecting via AirPods</span>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Exercise Indicator Section -->
<section class="flex flex-col items-center gap-4 mt-8">
<div class="w-20 h-20 liquid-glass rounded-full flex items-center justify-center p-4">
<img alt="Air Squats Icon" class="w-full h-full object-contain opacity-90" src="https://lh3.googleusercontent.com/aida/AP1WRLuCVz6pN_wND0Kem0BrS3RMcoZtRx7iuvjH79oq45WKZauJLfwB1py_N8fecvJdApzZrXtviIgcFXGgj3aslvD59XHOcPrBSEKEKUD1vYKjE99lDU9Iy5gygUbRv-2mmjHaQWx_HpoI0Bni6ttLfaZrnFwvo1ICbHEHzNNcEkomkm-w2zSAxdAWIYUAqB8KRREHZ3n31Bqd_C9TRcggCRpv6B4TuKXoZmQ2OAOLcKNny1Ztr4ftaMWe_A"/>
</div>
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Air Squats</h1>
<button class="font-label-sm text-label-sm text-on-surface-variant/60 hover:text-primary transition-colors mt-1">
                    Swap exercise
                </button>
</div>
</section>
<!-- Main Counter - Progress Ring -->
<section class="relative flex items-center justify-center w-full aspect-square max-w-[320px]">
<!-- The Ring -->
<svg class="w-full h-full" viewbox="0 0 100 100">
<!-- Background track -->
<circle class="text-primary/10" cx="50" cy="50" fill="transparent" r="45" stroke="currentColor" stroke-width="2"></circle>
<!-- Progress track -->
<circle class="text-surface-tint progress-ring-circle" cx="50" cy="50" fill="transparent" id="progress-ring" r="45" stroke="currentColor" stroke-dasharray="282.7" stroke-dashoffset="113.1" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<!-- Center Text -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<div class="flex items-baseline gap-1" id="rep-display">
<span class="font-display-xl-mobile text-[72px] leading-none text-primary font-bold">6</span>
<span class="font-display-xl-mobile text-display-xl-mobile text-on-surface-variant/30 font-medium">/ 10</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant/50 tracking-[0.2em] uppercase mt-2">Reps Done</span>
</div>
</section>
<!-- Interaction Area -->
<footer class="w-full flex flex-col items-center gap-6">
<!-- Manual Correction Button -->
<button class="flex items-center gap-2 px-6 py-3 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface-variant/80 border border-white/40" onclick="incrementRep()">
<span class="material-symbols-outlined text-[20px]">add</span>
<span class="font-label-sm text-label-sm font-semibold text-primary">+1 Manual</span>
</button>
<!-- Bottom Hint -->
<p class="font-label-sm text-label-sm text-on-surface-variant/40 max-w-[200px] text-center italic">
                Focus on depth and form for better detection
            </p>
</footer>
</main>
<!-- Simple Interaction Script -->
<script>
        let currentReps = 6;
        const targetReps = 10;
        const circumference = 2 * Math.PI * 45;

        function updateProgress() {
            const offset = circumference - (currentReps / targetReps) * circumference;
            const ring = document.getElementById('progress-ring');
            const display = document.getElementById('rep-display');
            
            ring.style.strokeDashoffset = offset;
            
            // Re-render the counter text to trigger animation
            display.innerHTML = `
                <span class="font-display-xl-mobile text-[72px] leading-none text-primary font-bold rep-counter-bump">${currentReps}</span>
                <span class="font-display-xl-mobile text-display-xl-mobile text-on-surface-variant/30 font-medium">/ ${targetReps}</span>
            `;
        }

        function incrementRep() {
            if (currentReps < targetReps) {
                currentReps++;
                updateProgress();
            }
            
            if (currentReps === targetReps) {
                // Success feedback haptic simulation
                setTimeout(() => {
                    alert('Movement goal reached! Well done.');
                }, 400);
            }
        }

        // Initialize
        updateProgress();
    </script>
</body></html>
