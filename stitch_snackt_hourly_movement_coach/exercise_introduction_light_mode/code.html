<!-- Not rendered as this is a focused Task-Focused/Onboarding screen -->
<script>
        function selectExercise(element) {
            // Remove selection from all cards
            const cards = document.querySelectorAll('.exercise-card');
            cards.forEach(card => {
                card.classList.remove('active-selection');
                card.classList.add('liquid-glass');
                // Hide check icon
                const checkIcon = card.querySelector('.group-focus\\:opacity-100');
                if(checkIcon) checkIcon.style.opacity = '0';
            });

            // Add selection to clicked card
            element.classList.add('active-selection');
            element.classList.remove('liquid-glass');
            const checkIcon = element.querySelector('.group-focus\\:opacity-100');
            if(checkIcon) checkIcon.style.opacity = '1';

            // Enable CTA button
            const cta = document.getElementById('cta-button');
            cta.disabled = false;
            cta.classList.remove('opacity-50', 'cursor-not-allowed');
            cta.classList.add('opacity-100');
            
            // Subtle haptic feel
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Add smooth entrance animation delays
        document.querySelectorAll('.exercise-card').forEach((card, index) => {
            card.style.animationDelay = `${(index + 1) * 100}ms`;
            card.classList.add('animate-in', 'fade-in', 'slide-in-from-bottom-2', 'duration-500', 'fill-mode-both');
        });
    </script>
